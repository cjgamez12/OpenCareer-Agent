<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ job.company }} – {{ "Cover letter" if doc == "cover_letter" else "Resume" }}</title>
  <style>
    @page { size: letter; margin: 0.5in; }
    {% if pdf %}body { padding: 0; }{% endif %}
    body { font: 10.5pt/1.35 "Helvetica Neue", Arial, sans-serif; color:#111; max-width: 7.5in; margin: 0 auto; padding: 24px; }
    h1 { font-size: 20pt; margin: 0 0 2px; text-align:center; }
    h1 + p { text-align:center; margin-top:0; }
    h2 { font-size: 11pt; text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid #111; margin: 12px 0 4px; padding-bottom: 1px; }
    p { margin: 4px 0; } ul { margin: 2px 0 6px; padding-left: 18px; } li { margin: 1px 0; }
    .bar { background:#ddf4ff; border:1px solid #54aeff; border-radius:8px; padding:10px 14px; margin-bottom:18px; font-family: -apple-system, sans-serif; }
    {% if doc == "cover_letter" %}body { font-size: 11pt; line-height: 1.5; } p { margin: 0 0 12px; }{% endif %}
    @media print { .bar { display:none; } body { padding:0; } }
  </style>
</head>
<body>
  {% if not pdf %}<div class="bar">Press <b>Cmd+P</b>, then choose <b>Save as PDF</b>. This bar won't be printed.</div>{% endif %}
  {{ text|markdown }}
</body>
</html>
